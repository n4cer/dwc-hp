# Login and password-link URLs: 10 requests per minute and client address, with
# a burst of 5. A second brake in front of the application's own per-address and
# per-nick limits, so a flood never even reaches the JVM and its BCrypt checks.
# This file is included in nginx's http context, where limit_req_zone belongs.
limit_req_zone $binary_remote_addr zone=dwc_login:10m rate=10r/m;

# HTTP -> HTTPS + WWW
server {
    listen 80;
    listen [::]:80;
    server_name doomwarriors.de www.doomwarriors.de;

    access_log /var/log/nginx/doomwarriors.access_log main;
    error_log  /var/log/nginx/doomwarriors.error_log info;

    return 301 https://www.doomwarriors.de$request_uri;
}

# HTTPS without WWW -> HTTPS with WWW
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doomwarriors.de;

    ssl_certificate     /etc/letsencrypt/live/doomwarriors.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doomwarriors.de/privkey.pem;

    access_log /var/log/nginx/doomwarriors.ssl_access_log main;
    error_log  /var/log/nginx/doomwarriors.ssl_error_log info;

    return 301 https://www.doomwarriors.de$request_uri;
}

# Website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.doomwarriors.de;

    ssl_certificate     /etc/letsencrypt/live/doomwarriors.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doomwarriors.de/privkey.pem;

    access_log /var/log/nginx/doomwarriors.ssl_access_log main;
    error_log  /var/log/nginx/doomwarriors.ssl_error_log info;

    # Video, download and Quake 3 map bytes: the application answers range requests here, so
    # nginx must pass them straight through. Without proxy_buffering off it would
    # spool whole files to disk before sending them, and the 60s timeout below
    # would abort slow downloads of the larger ones.
    #
    # This matches the byte endpoints only, never the /videos or /downloads page.
    # A prefix location "/videos/" must not be used here: for prefix locations
    # ending in a slash that are handled by proxy_pass, nginx answers the same URI
    # without the slash with a 301 that appends it. That would send /videos to
    # /videos/, which the application redirects back to /videos, looping forever.
    location ~ ^/(videos/(stream|download)|downloads/file|quake3/pk3)/ {
        proxy_pass http://127.0.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ~ ^/(admin/login|set-password/) {
        limit_req zone=dwc_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
