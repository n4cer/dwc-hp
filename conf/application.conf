play.http.secret.key = "changeme"

# Default language is German; browsers that don't accept German get English.
play.i18n.langs = ["de", "en"]

db.default.driver="org.postgresql.Driver"
db.default.url="jdbc:postgresql://localhost:5432/dwc"
db.default.username="postgres"
db.default.password="bla"

ebean.default = ["models.*"]

play.filters.hosts.allowed = ["doomwarriors.de", "www.doomwarriors.de", "localhost"]
play.filters.enabled += play.filters.csp.CSPFilter
# Lets the password link page send "Referrer-Policy: no-referrer" instead of the
# filter default; no other action sets security headers of its own.
play.filters.headers.allowActionSpecificHeaders = true
play.filters.csp.nonce.enabled = false
play.filters.csp.directives {
  default-src = "'self'"
  base-uri = "'self'"
  object-src = "'none'"
  frame-ancestors = "'none'"
  form-action = "'self'"
  script-src = "'self'"
  style-src = "'self'"
  img-src = "'self' data:"
  media-src = "'self'"
  connect-src = "'self'"
  font-src = "'self'"
  upgrade-insecure-requests = ""
}

play.modules.enabled += "controllers.AuthModule"

# Members sign in with their nick. As long as no active member is an administrator,
# the member named by DWC_ADMIN_USERNAME becomes one on startup and gets
# DWC_ADMIN_PASSWORD as password if they have none yet (see AuthBootstrap). Both
# variables can be removed once an administrator exists.
auth.bootstrap.nick=${?DWC_ADMIN_USERNAME}
auth.bootstrap.password=${?DWC_ADMIN_PASSWORD}
# Failed logins per client address and per nick (see LoginThrottle).
auth.clientRateLimit.maxAttempts=5
auth.clientRateLimit.window=15 minutes
auth.accountRateLimit.maxAttempts=10
auth.accountRateLimit.window=15 minutes
auth.passwordToken.validity=48 hours
play.http.session.maxAge=12 hours

# Quake 3 server control sidecar (see deploy/quake3ctl.py, deploy/quake3ctl.service).
# Stays disabled until the token is set to the same value as quake3ctl.env.
quake3.control.baseUrl="http://127.0.0.1:8765"
quake3.control.token=${?DWC_QUAKE3_TOKEN}

# Public Quake 3 server status shown in the site-wide sidebar (see
# Quake3StatusScheduler). Stays disabled until the host is set; ports default
# to the servers' own docker-compose port mappings on that host.
play.modules.enabled += "controllers.Quake3Module"
quake3.public.host=${?DWC_QUAKE3_PUBLIC_HOST}
quake3.public.duel.port=${?DWC_QUAKE3_DUEL_PORT}
quake3.public.tdm.port=${?DWC_QUAKE3_TDM_PORT}
quake3.public.ctf.port=${?DWC_QUAKE3_CTF_PORT}

# Folder holding the servers' games.log files, one subfolder per mode
# (logs/duel, logs/tdm, logs/ctf in the q3server deploy directory). The
# statistics page (/quake3/stats) stays empty until it is set.
quake3.logs.folder=${?DWC_QUAKE3_LOG_FOLDER}

owner.name="Name"
owner.street="Straße"
owner.city="Ort"
owner.email="email"
owner.phone=""
copyright="2022"

privacy.country="Deutschland"
privacy.email="email"

# Directory outside the project served at runtime, must contain the subfolders
# random/, clanwars/ and lineup/ with the respective image files.
picture_folder="/tmp/pics/"

# Directory outside the project holding the archive videos. The originals sit
# directly in it, the browser-playable MP4s in web/ and the preview images in
# posters/ (see deploy/transcode-videos.sh).
video_folder="/tmp/videos/"

# Directory outside the project holding the files offered under /downloads. Only
# the file types whitelisted in HomeController.FILE_EXTENSIONS are ever served.
download_folder="/tmp/downloads/"
site.baseUrl="https://www.doomwarriors.de"
