play.http.secret.key = "changeme"

db.default.driver="org.postgresql.Driver"
db.default.url="jdbc:postgresql://localhost:5432/dwc"
db.default.username="postgres"
db.default.password="bla"

ebean.default = ["models.*"]

play.filters.hosts.allowed = ["doomwarriors.de", "www.doomwarriors.de", "localhost"]
play.filters.enabled += play.filters.csp.CSPFilter
play.filters.csp.nonce.enabled = false
play.filters.csp.directives {
  default-src = "'self'"
  base-uri = "'self'"
  object-src = "'none'"
  frame-ancestors = "'none'"
  form-action = "'self'"
  script-src = "'self'"
  style-src = "'self'"
  img-src = "'self' data:"
  connect-src = "'self'"
  font-src = "'self'"
  upgrade-insecure-requests = ""
}

# The admin area stays disabled until both environment variables are set.
admin.username=${?DWC_ADMIN_USERNAME}
admin.password=${?DWC_ADMIN_PASSWORD}
admin.loginRateLimit.maxAttempts=5
admin.loginRateLimit.window=15 minutes

owner.name="Name"
owner.street="Straße"
owner.city="Ort"
owner.email="email"
owner.phone=""
copyright="2022"

privacy.country="Deutschland"
privacy.email="email"

picture_folder="/tmp/pics/"
