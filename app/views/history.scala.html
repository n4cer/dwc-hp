@(entries : List[History])

@main("Geschichte", "Die Geschichte und Entwicklung des Doomwarriors Clans.", controllers.routes.HomeController.history.url) {
    <div class="mitteContent">
        <h1>Geschichte des Doomwarriors Clans</h1>
        @for(entry <- entries) {
        <div class="mitteContent">
            <p>@Html(ContentSanitizer.sanitizeHtml(entry.getContent()))</p>
        </div>
        }
    </div>
}
