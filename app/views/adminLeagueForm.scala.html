@(request: Http.Request, item: League, error: String)

@main(if(item == null) "Add league" else "Edit league", noindex = true) {
    <div class="admin-page">
        <p class="admin-back"><a href="@controllers.routes.AdminController.leagueIndex()">&laquo; Back to leagues</a></p>
        <h1>@if(item == null) { Add league } else { Edit league }</h1>
        @if(error != null) { <div class="admin-message error">@error</div> }
        <form method="post" action="@if(item == null) {@controllers.routes.AdminController.createLeague()} else {@controllers.routes.AdminController.updateLeague(item.getId())}">
            @helper.CSRF.formField(request.asScala())
            <div class="admin-grid">
                <label>League *<input type="text" name="league" required value="@if(item != null) {@item.getLeague()}"></label>
            </div>
            <div class="admin-actions"><button type="submit">Save</button><a href="@controllers.routes.AdminController.leagueIndex()">Cancel</a></div>
        </form>
    </div>
}
