@(name : String, street : String, city : String, email : String, messages: play.i18n.Messages)

@main(messages.at("imprint.title"), messages, messages.at("imprint.description"), controllers.routes.HomeController.imprint().url) {
    <div class="container">
        <header>
            <h1>@messages.at("imprint.title")</h1>
        </header>
        <p>@name<br/>
        @street<br/>
        @city</p>

<p><a href="mailto:@Html(email)">@Html(email)</a><br/></p>

  </div>
}
