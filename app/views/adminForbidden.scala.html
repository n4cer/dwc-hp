@(user: User, role: Role, messages: play.i18n.Messages)

@main("Access denied", messages, noindex = true) {
    <div class="admin-page">
        <p class="admin-back"><a href="@controllers.routes.AdminController.index()">&laquo; Back to administration</a></p>
        <h1>Access denied</h1>
        <div class="admin-message error">
            @user.getNick(), this area requires the role <strong>@role.getLabel()</strong>. Ask an administrator if you need it.
        </div>
    </div>
}
