@(request: Http.Request, games: List[Game])

@main("Game administration", noindex = true) {
    <div class="admin-page">
        <p class="admin-back"><a href="@controllers.routes.AdminController.index()">&laquo; Back to administration</a></p>
        <div class="admin-header"><h1>Games</h1><a class="admin-button" href="@controllers.routes.AdminController.newGame()">Add game</a></div>
        @request.flash().get("success").map { message =>
            <div class="admin-message success">@message</div>
        }
        <table class="admin-table"><thead><tr><th scope="col">Description</th><th scope="col">Short</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead><tbody>
        @for(item <- games) {
            <tr><td>@item.getDescription()</td><td>@item.getShortText()</td>
                <td><a href="@controllers.routes.AdminController.editGame(item.getId())">Edit</a></td></tr>
        }
        </tbody></table>
    </div>
}
